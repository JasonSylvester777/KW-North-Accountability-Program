<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KW North Accountability Login</title>
<style>
:root{--red:#B40101;--bg:#f4f5f7;--line:#e5e7eb;--shadow:0 12px 32px rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1f2937}.wrap{max-width:760px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;padding:24px;border-radius:24px;display:flex;gap:18px;align-items:center;box-shadow:var(--shadow)}.hero img{width:80px;height:80px;object-fit:contain;background:#fff;border-radius:18px;padding:8px}.hero h1{margin:0;font-size:28px}.hero p{margin:7px 0 0;color:#d1d5db}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-top:18px;padding:24px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:13px;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:13px 18px;margin-top:14px;font-size:15px;font-weight:700;background:var(--red);color:#fff;cursor:pointer}.help{font-size:12px;color:#6b7280;margin-top:10px}.status{padding:11px 13px;border-radius:10px;margin-top:12px;font-weight:700;font-size:13px;background:#fef2f2;color:#991b1b}@media(max-width:560px){.wrap{padding:10px}.hero{align-items:flex-start}.hero h1{font-size:22px}.hero img{width:62px;height:62px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="KW_LOGO-removebg-preview.png" alt="KW North"><div><h1>KW North Accountability</h1><p>Agent Login</p></div></div>
  <div class="card">
    <div class="field"><label>Name and Surname</label><input id="fullName" type="text" autocomplete="name" placeholder="e.g. James Kekana" autofocus></div>
    <div class="help">Enter your name and surname as registered with KW North.</div>
    <button class="btn" id="loginBtn">Continue</button>
    <div id="status"></div>
  </div>
</div>
<script>
const LOGIN_API='https://fdbsqjtwbucjhjgphhyh.supabase.co/functions/v1/accountability-name-login';
const input=document.getElementById('fullName');
const button=document.getElementById('loginBtn');
const statusBox=document.getElementById('status');
async function login(){
  const full_name=input.value.trim();
  statusBox.innerHTML='';
  if(!full_name){statusBox.innerHTML='<div class="status">Please enter your name and surname.</div>';return;}
  button.disabled=true;
  try{
    const r=await fetch(LOGIN_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Login failed.');
    localStorage.setItem('kw_accountability_token',d.token);
    window.location.replace('/index.html');
  }catch(e){statusBox.innerHTML='<div class="status">'+e.message+'</div>';}
  finally{button.disabled=false;}
}
button.addEventListener('click',login);
input.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
if(localStorage.getItem('kw_accountability_token')) window.location.replace('/index.html');
</script>
</body>
</html>
